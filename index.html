<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Obat Diare - RS Dian Husada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Jost', 'Google Sans', 'sans-serif'] },
                }
            }
        }
        
        const APP_VERSION = "1.0.9"; 

        const savedTheme = localStorage.getItem('theme_obat');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* EKSTRIM PRINT OPTIMIZATION - FIXED MARGINS */
        @media print {
            @page { margin: 1.5cm; size: A4; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; font-size: 10pt; line-height: 1.4; }
            main { display: block !important; padding: 0 !important; margin: 0 !important; }
            section { width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .scroll-area-custom { height: auto !important; overflow: visible !important; }
            
            .print-table { 
                display: table !important; 
                width: 100%; 
                border-collapse: collapse; 
                margin-top: 20px;
                table-layout: fixed; /* Mencegah kolom meluap */
            }
            .print-table th, .print-table td { 
                border: 1pt solid #333; 
                padding: 8px 10px; 
                text-align: left; 
                vertical-align: top;
                word-wrap: break-word; /* Mencegah teks bertumpuk */
            }
            .print-table th { background: #f0f0f0 !important; font-weight: bold; text-transform: uppercase; font-size: 9pt; }
            .medicines-list { display: flex; flex-direction: column; gap: 2px; }
            .med-tag { font-size: 9pt; }
        }
        
        .print-only { display: none; }
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .scroll-area-custom::-webkit-scrollbar { width: 6px; }
        .scroll-area-custom::-webkit-scrollbar-track { background: transparent; }
        .scroll-area-custom::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark .scroll-area-custom::-webkit-scrollbar-thumb { background: #334155; }
        .scroll-area-custom::-webkit-scrollbar-thumb:hover { background: #10b981; }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-update { animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#0b0e11] text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0HNTB7x7siB9Ps4cT5MRPhPSw7In5NaY",
            authDomain: "data-pasien-hiv.firebaseapp.com",
            projectId: "data-pasien-hiv",
            storageBucket: "data-pasien-hiv.firebasestorage.app",
            messagingSenderId: "770845270634",
            appId: "1:770845270634:web:63e2f522a00d20534fe013"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FB_OBAT = { 
            auth, db, collection, doc, addDoc, updateDoc, deleteDoc, 
            onSnapshot, signInWithEmailAndPassword, onAuthStateChanged, signOut 
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const LucideIcon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(() => document.documentElement.classList.contains('dark'));
            const [appLoading, setAppLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [hasUpdate, setHasUpdate] = useState(false);
            const [editingId, setEditingId] = useState(null);
            
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                patientName: '',
                recordNumber: '',
                medicines: [{ type: '', qty: '' }]
            });

            useEffect(() => {
                const checkUpdates = async () => {
                    try {
                        const res = await fetch(window.location.href, { cache: 'no-store' });
                        const text = await res.text();
                        const match = text.match(/const APP_VERSION = "(.*?)";/);
                        if (match && match[1] !== APP_VERSION) {
                            setHasUpdate(true);
                        }
                    } catch (e) { console.error(e); }
                };
                const interval = setInterval(checkUpdates, 60000);
                checkUpdates();
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.FB_OBAT) {
                        window.FB_OBAT.onAuthStateChanged(window.FB_OBAT.auth, (u) => {
                            setUser(u);
                            setAppLoading(false);
                        });
                    }
                }, 500);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!user || !window.FB_OBAT) return;
                const unsub = window.FB_OBAT.onSnapshot(window.FB_OBAT.collection(window.FB_OBAT.db, "obat_diare"), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLogs(data.sort((a, b) => new Date(b.date) - new Date(a.date)));
                });
                return () => unsub();
            }, [user]);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', isDarkMode);
                localStorage.setItem('theme_obat', isDarkMode ? 'dark' : 'light');
            }, [isDarkMode]);

            const medicineTotals = useMemo(() => {
                const totals = {};
                logs.forEach(log => {
                    log.medicines?.forEach(med => {
                        const name = med.type.trim().toUpperCase();
                        const qty = parseInt(med.qty) || 0;
                        if (name) totals[name] = (totals[name] || 0) + qty;
                    });
                });
                return Object.entries(totals).sort((a, b) => b[1] - a[1]);
            }, [logs]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    if (editingId) {
                        const docRef = window.FB_OBAT.doc(window.FB_OBAT.db, "obat_diare", editingId);
                        await window.FB_OBAT.updateDoc(docRef, {
                            ...formData,
                            updatedAt: Date.now()
                        });
                        setEditingId(null);
                    } else {
                        await window.FB_OBAT.addDoc(window.FB_OBAT.collection(window.FB_OBAT.db, "obat_diare"), {
                            ...formData,
                            createdAt: Date.now(),
                            createdBy: user.email
                        });
                    }
                    setFormData({
                        date: new Date().toISOString().split('T')[0],
                        patientName: '',
                        recordNumber: '',
                        medicines: [{ type: '', qty: '' }]
                    });
                } catch (err) { alert("Gagal memproses data."); }
            };

            const startEdit = (log) => {
                setEditingId(log.id);
                setFormData({
                    date: log.date,
                    patientName: log.patientName,
                    recordNumber: log.recordNumber,
                    medicines: log.medicines || [{ type: '', qty: '' }]
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelEdit = () => {
                setEditingId(null);
                setFormData({
                    date: new Date().toISOString().split('T')[0],
                    patientName: '',
                    recordNumber: '',
                    medicines: [{ type: '', qty: '' }]
                });
            };

            if (appLoading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 dark:bg-[#0b0e11]">
                    <div className="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Sinkronisasi Sistem...</p>
                </div>
            );
            
            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-[#0b0e11]">
                    <div className="w-full max-w-md bg-white dark:bg-[#16191c] p-10 rounded-[2.5rem] border border-slate-200 dark:border-slate-800 shadow-2xl">
                        <div className="text-center mb-8">
                            <div className="inline-flex p-4 bg-emerald-600 rounded-3xl text-white shadow-xl mb-4">
                                <LucideIcon name="shield-check" size={32} />
                            </div>
                            <h1 className="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Database Pemakaian Obat Antidiare</h1>
                            <p className="text-slate-400 text-sm font-medium uppercase tracking-widest">IGD RS Dian Husada</p>
                        </div> 
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const email = e.target.email.value;
                            const password = e.target.password.value;
                            try {
                                await window.FB_OBAT.signInWithEmailAndPassword(window.FB_OBAT.auth, email, password);
                            } catch (err) { alert("Akses Ditolak."); }
                        }} className="space-y-4">
                            <input name="email" type="email" placeholder="Email Petugas" className="w-full px-5 py-4 rounded-2xl bg-slate-50 dark:bg-[#0b0e11] border-none outline-none focus:ring-2 ring-emerald-500 transition-all dark:text-white" required />
                            <input name="password" type="password" placeholder="Password" className="w-full px-5 py-4 rounded-2xl bg-slate-50 dark:bg-[#0b0e11] border-none outline-none focus:ring-2 ring-emerald-500 transition-all dark:text-white" required />
                            <button type="submit" className="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg shadow-emerald-500/10 active:scale-95 transition-all">MASUK SISTEM</button>
                        </form>
                    </div>
                </div>
            );

            const filteredLogs = logs.filter(l => 
                l.patientName.toLowerCase().includes(searchTerm.toLowerCase()) || 
                l.recordNumber.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="min-h-screen pb-10 transition-colors duration-500">
                    {hasUpdate && (
                        <div className="no-print sticky top-0 z-[60] bg-indigo-600 text-white px-6 py-3 flex items-center justify-between shadow-xl animate-update">
                            <div className="flex items-center gap-3">
                                <LucideIcon name="sparkles" size={20} className="animate-pulse" />
                                <p className="text-xs font-bold uppercase tracking-tight">Versi Baru Tersedia!</p>
                            </div>
                            <button onClick={() => window.location.reload()} className="bg-white text-indigo-600 px-4 py-1.5 rounded-full text-[10px] font-black hover:bg-slate-100 active:scale-95 transition-all">UPDATE SEKARANG</button>
                        </div>
                    )}

                    <nav className="no-print sticky top-0 z-50 backdrop-blur-xl bg-white/70 dark:bg-[#0f1113]/70 border-b border-slate-200 dark:border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-emerald-600 rounded-2xl text-white shadow-lg">
                                    <LucideIcon name="pill" size={20} />
                                </div>
                                <div>
                                    <h1 className="text-lg font-black tracking-tighter">IGD RS Dian Husada</h1>
                                    <p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest">aplikasi v{APP_VERSION}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400">
                                    <LucideIcon name={isDarkMode ? "sun" : "moon"} />
                                </button>
                                <button onClick={() => window.print()} className="bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-5 py-2.5 rounded-2xl text-xs font-black flex items-center gap-2">
                                    <LucideIcon name="printer" size={16} /> CETAK
                                </button>
                                <button onClick={() => window.FB_OBAT.signOut(window.FB_OBAT.auth)} className="p-3 rounded-2xl bg-rose-50 dark:bg-rose-900/10 text-rose-500">
                                    <LucideIcon name="log-out" />
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                        <aside className="no-print lg:col-span-4 lg:sticky lg:top-24 space-y-6">
                            <div className={`bg-white dark:bg-[#16191c] p-8 rounded-[2.5rem] border ${editingId ? 'border-amber-500 shadow-amber-500/10' : 'border-slate-200 dark:border-slate-800 shadow-xl'}`}>
                                <h2 className={`text-xl font-black mb-8 flex items-center gap-3 ${editingId ? 'text-amber-500' : 'text-emerald-600'}`}>
                                    <LucideIcon name={editingId ? "edit-3" : "plus-circle"} size={24} /> 
                                    {editingId ? "Edit Data Pasien" : "Input Pemakaian Obat"}
                                </h2>
                                <form onSubmit={handleSubmit} className="space-y-5">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tgl Layanan</label>
                                            <input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full px-4 py-3 text-sm rounded-2xl bg-slate-50 dark:bg-[#0b0e11] border-none focus:ring-2 ring-emerald-500 outline-none dark:text-white" required />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">No. RM</label>
                                            <input type="text" placeholder="RM-" value={formData.recordNumber} onChange={e => setFormData({...formData, recordNumber: e.target.value})} className="w-full px-4 py-3 text-sm rounded-2xl bg-slate-50 dark:bg-[#0b0e11] border-none focus:ring-2 ring-emerald-500 outline-none dark:text-white" required />
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nama Lengkap Pasien</label>
                                        <input type="text" placeholder="Masukkan nama..." value={formData.patientName} onChange={e => setFormData({...formData, patientName: e.target.value})} className="w-full px-4 py-3 text-sm rounded-2xl bg-slate-50 dark:bg-[#0b0e11] border-none focus:ring-2 ring-emerald-500 outline-none dark:text-white" required />
                                    </div>

                                    <div className="space-y-4 pt-6 border-t border-slate-100 dark:border-slate-800">
                                        <div className="flex justify-between items-center">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Obat yang Diberikan</label>
                                            <button type="button" onClick={() => setFormData({...formData, medicines: [...formData.medicines, {type:'', qty:''}]})} className="bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 p-2 rounded-xl hover:scale-110 transition-transform">
                                                <LucideIcon name="plus" size={16} />
                                            </button>
                                        </div>
                                        {formData.medicines.map((med, idx) => (
                                            <div key={idx} className="flex gap-2 items-center">
                                                <input type="text" placeholder="Nama Obat" value={med.type} onChange={e => { const m = [...formData.medicines]; m[idx].type = e.target.value; setFormData({...formData, medicines: m}); }} className="flex-grow px-4 py-3 text-xs rounded-xl bg-slate-50 dark:bg-[#0b0e11] border-none outline-none dark:text-white" required />
                                                <input type="number" placeholder="Jml" value={med.qty} onChange={e => { const m = [...formData.medicines]; m[idx].qty = e.target.value; setFormData({...formData, medicines: m}); }} className="w-16 px-3 py-3 text-xs text-center rounded-xl bg-slate-50 dark:bg-[#0b0e11] border-none outline-none font-bold dark:text-white" required />
                                                {formData.medicines.length > 1 && (
                                                    <button type="button" onClick={() => setFormData({...formData, medicines: formData.medicines.filter((_, i) => i !== idx)})} className="text-rose-400 hover:text-rose-600"><LucideIcon name="trash" size={14} /></button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <button type="submit" className={`w-full py-4 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs ${editingId ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                                            {editingId ? 'Update Perubahan' : 'Simpan Data'}
                                        </button>
                                        {editingId && (
                                            <button type="button" onClick={cancelEdit} className="w-full py-3 bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold rounded-2xl text-xs uppercase">Batal Edit</button>
                                        )}
                                    </div>
                                </form>
                            </div>
                        </aside>

                        <section className="lg:col-span-8 space-y-4">
                            <div className="bg-white dark:bg-[#16191c] p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest flex items-center gap-2">
                                    <LucideIcon name="bar-chart-2" size={14} /> Total Pengeluaran Obat
                                </h3>
                                <div className="flex flex-wrap gap-2">
                                    {medicineTotals.map(([name, total]) => (
                                        <div key={name} className="flex items-center gap-2 bg-slate-50 dark:bg-[#0b0e11] px-3 py-1 rounded-lg border border-slate-100 dark:border-slate-800">
                                            <span className="text-[9px] font-bold text-slate-500 uppercase">{name}</span>
                                            <span className="text-emerald-600 font-black text-[10px]">{total}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="no-print relative">
                                <LucideIcon name="search" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input type="text" placeholder="Cari Pasien / No RM..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-3 bg-white dark:bg-[#16191c] rounded-2xl border border-slate-200 dark:border-slate-800 outline-none text-sm dark:text-white shadow-sm" />
                            </div>

                            <div className="no-print">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Riwayat Log Pasien</h3>
                                    <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded-full">{filteredLogs.length} Entri</span>
                                </div>
                                
                                <div className="scroll-area-custom max-h-[600px] overflow-y-auto pr-2 space-y-3">
                                    {filteredLogs.map(l => (
                                        <div key={l.id} className={`bg-white dark:bg-[#16191c] p-4 rounded-2xl border flex items-center justify-between gap-4 group transition-all ${editingId === l.id ? 'border-amber-500 ring-1 ring-amber-500' : 'border-slate-200 dark:border-slate-800 hover:border-emerald-500'}`}>
                                            <div className="flex-grow min-w-0">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-[9px] font-black bg-emerald-600 text-white px-1.5 py-0.5 rounded uppercase tracking-tighter">{l.recordNumber}</span>
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase">{new Date(l.date).toLocaleDateString('id-ID')}</span>
                                                </div>
                                                <h3 className="text-sm font-black text-slate-900 dark:text-white uppercase truncate">{l.patientName}</h3>
                                                <div className="flex flex-wrap gap-1.5 mt-2">
                                                    {l.medicines?.map((m, i) => (
                                                        <span key={i} className="text-[9px] bg-slate-50 dark:bg-slate-800 px-2 py-0.5 rounded-md border border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300">
                                                            {m.type} <b className="text-emerald-600 ml-0.5">{m.qty}</b>
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => startEdit(l)} className="text-slate-300 hover:text-amber-500 transition-colors p-2">
                                                    <LucideIcon name="edit-3" size={16} />
                                                </button>
                                                <button onClick={async () => { if(confirm("Hapus data ini?")) window.FB_OBAT.deleteDoc(window.FB_OBAT.doc(window.FB_OBAT.db, "obat_diare", l.id)) }} className="text-slate-200 hover:text-rose-500 transition-colors p-2">
                                                    <LucideIcon name="trash-2" size={16} />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <table className="print-only print-table">
                                <thead>
                                    <tr>
                                        <th style={{width: '30px'}}>No</th>
                                        <th style={{width: '85px'}}>Tgl Layanan</th>
                                        <th style={{width: '90px'}}>No. RM</th>
                                        <th>Nama Pasien</th>
                                        <th>Obat & Jumlah</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredLogs.map((l, index) => (
                                        <tr key={l.id}>
                                            <td className="text-center">{index + 1}</td>
                                            <td>{new Date(l.date).toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit', year:'numeric'})}</td>
                                            <td className="font-bold">{l.recordNumber}</td>
                                            <td className="uppercase font-medium">{l.patientName}</td>
                                            <td>
                                                <div className="medicines-list">
                                                    {l.medicines?.map((m, i) => (
                                                        <div key={i} className="med-tag">• {m.type} ({m.qty})</div>
                                                    ))}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </section>
                    </main>

                    <footer className="print-only text-[10px] text-center mt-10 text-slate-500 border-t pt-4">
                        Dicetak pada: {new Date().toLocaleString('id-ID')} | Sistem Log Antidiare RS Dian Husada | v{APP_VERSION}
